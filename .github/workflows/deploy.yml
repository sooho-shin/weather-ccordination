name: Deploy to Cloudflare Pages

# main에 푸시하면 검사(타입체크·유닛 테스트) 후 https://dize-weather.pages.dev 에 자동 배포합니다.
# 저장소 Secrets(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)가 설정되기 전에는 배포를 건너뜁니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dize-weather
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 배포 설정(Secrets) 확인
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID Secrets가 없어 배포를 건너뜁니다. README의 '자동 배포' 설정을 확인하세요."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: 의존성 설치
        if: steps.config.outputs.enabled == 'true'
        # package-lock.json이 package.json과 어긋나 있어 npm ci 대신 npm install 사용
        run: npm install --no-audit --no-fund

      - name: 타입체크
        if: steps.config.outputs.enabled == 'true'
        run: npx tsc --noEmit

      - name: 유닛 테스트
        if: steps.config.outputs.enabled == 'true'
        run: npx tsx --import ./tests/setup.cjs --test tests/unit/*.test.ts

      - name: 웹 빌드
        if: steps.config.outputs.enabled == 'true'
        run: npx expo export -p web

      - name: Cloudflare Pages 배포
        if: steps.config.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name dize-weather --branch main
