name: "CI/CD Pipeline (Cloudflare Pages)"

# main에 푸시하거나 PR을 생성하면 검사(타입체크·하네스·유닛 테스트) 및 웹 번들 빌드를 수행합니다.
# 저장소 Secrets(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)가 설정되어 있으면 Cloudflare Pages에 자동 배포합니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dize-weather
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: "CI/CD: 검증, 빌드 및 배포"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "코드 체크아웃"
        uses: actions/checkout@v4

      - name: "Node.js 22 설정"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Python 3.11 설정"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "의존성 설치"
        run: npm install --no-audit --no-fund

      - name: "통합 하네스 및 유닛 테스트 검증"
        run: python3 scripts/run_harness.py

      - name: "Expo 웹 번들 빌드"
        env:
          EXPO_PUBLIC_HIVE_SECRET_KEY: ${{ secrets.EXPO_PUBLIC_HIVE_SECRET_KEY || 'Ns1eXLfQSN5f5vXHUMzbOw==' }}
          EXPO_PUBLIC_HIVE_ACCESS_KEY: ${{ secrets.EXPO_PUBLIC_HIVE_ACCESS_KEY || 'HeH12nyDzM5u7nFJ' }}
          EXPO_PUBLIC_DEEPSEEK_API_KEY: ${{ secrets.EXPO_PUBLIC_DEEPSEEK_API_KEY || 'Ns1eXLfQSN5f5vXHUMzbOw==' }}
          EXPO_PUBLIC_DEEPSEEK_BASE_URL: ${{ secrets.EXPO_PUBLIC_DEEPSEEK_BASE_URL || 'https://api-cdn.thehive.ai/api/v3' }}
          EXPO_PUBLIC_DEEPSEEK_MODEL: ${{ secrets.EXPO_PUBLIC_DEEPSEEK_MODEL || 'deepseek-ai/deepseek-v4.1-flash-1017' }}
        run: npx expo export -p web

      - name: "Cloudflare Pages 자동 배포"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 40자리 Cloudflare API 토큰 및 32자리 계정 ID 정밀 추출
          # (curl 명령어 전체, Bearer 접두사, 공백, 줄바꿈, 따옴표 등이 포함되어 있어도 자동 추출)
          CLEAN_TOKEN=$(python3 -c '
import os, re, sys
raw = os.environ.get("RAW_TOKEN", "")
m = re.search(r"Bearer\s+([a-zA-Z0-9_-]{40})", raw, re.IGNORECASE)
if m:
    print(m.group(1))
    sys.exit(0)
m2 = re.search(r"([a-zA-Z0-9_-]{40})", raw)
if m2:
    print(m2.group(1))
    sys.exit(0)
cleaned = re.sub(r"[\r\n \"\x27\\]", "", raw)
cleaned = re.sub(r"^[bB][eE][aA][rR][eE][rR]", "", cleaned)
print(cleaned)
')
          CLEAN_ACCOUNT_ID=$(python3 -c '
import os, re
raw = os.environ.get("RAW_ACCOUNT_ID", "")
m = re.search(r"([0-9a-fA-F]{32})", raw)
if m:
    print(m.group(1).lower())
else:
    print(re.sub(r"[\r\n \"\x27\\]", "", raw).lower())
')

          if [ -z "$CLEAN_TOKEN" ] || [ -z "$CLEAN_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 또는 CLOUDFLARE_ACCOUNT_ID가 비어있어 배포를 건너뜁니다."
            exit 0
          fi

          echo "🔍 토큰 유효성 검사 (길이: ${#CLEAN_TOKEN} 글자, 계정ID 길이: ${#CLEAN_ACCOUNT_ID} 글자)..."

          # 2. Cloudflare API 토큰 검증 API 호출 (/user/tokens/verify)
          VERIFY_RES=$(curl -s -w "\n%{http_code}" -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLEAN_TOKEN}" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$VERIFY_RES" | tail -n1)
          BODY=$(echo "$VERIFY_RES" | sed '$d')

          echo "인증 상태 코드: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Cloudflare 토큰 인증 실패 ($HTTP_STATUS): $BODY"
            echo "::notice::CLOUDFLARE_API_TOKEN의 형식을 확인해주세요. (글자 수: ${#CLEAN_TOKEN})"
            exit 1
          fi

          echo "✔ Cloudflare API 토큰 인증 성공!"
          echo "🚀 Cloudflare Pages로 배포를 시작합니다..."
          CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CLEAN_ACCOUNT_ID" npx wrangler pages deploy dist --project-name dize-weather --branch main
